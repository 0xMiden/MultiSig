services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.coordinator-frontend
      args:
        NEXT_PUBLIC_GUARDIAN_ENDPOINT: "${NEXT_PUBLIC_GUARDIAN_ENDPOINT:?Set NEXT_PUBLIC_GUARDIAN_ENDPOINT}"
        NEXT_PUBLIC_GUARDIAN_ENDPOINTS: "${NEXT_PUBLIC_GUARDIAN_ENDPOINTS:-}"
        NEXT_PUBLIC_MIDEN_NETWORK: "${NEXT_PUBLIC_MIDEN_NETWORK:?Set NEXT_PUBLIC_MIDEN_NETWORK}"
        NEXT_PUBLIC_MIDEN_RPC_URL: "${NEXT_PUBLIC_MIDEN_RPC_URL:?Set NEXT_PUBLIC_MIDEN_RPC_URL}"
        NEXT_PUBLIC_MIDEN_NOTE_TRANSPORT_URL: "${NEXT_PUBLIC_MIDEN_NOTE_TRANSPORT_URL:?Set NEXT_PUBLIC_MIDEN_NOTE_TRANSPORT_URL}"
        NEXT_PUBLIC_MIDEN_PROVER_URL: "${NEXT_PUBLIC_MIDEN_PROVER_URL:-local}"
        NEXT_PUBLIC_MIDEN_REGISTRATION_CODE: "${NEXT_PUBLIC_MIDEN_REGISTRATION_CODE:-guardian}"
        NEXT_PUBLIC_PARA_API_KEY: "${NEXT_PUBLIC_PARA_API_KEY:-}"
        NEXT_PUBLIC_PARA_ENVIRONMENT: "${NEXT_PUBLIC_PARA_ENVIRONMENT:-development}"
        NEXT_PUBLIC_CHAT_ENDPOINT: "${NEXT_PUBLIC_CHAT_ENDPOINT:-}"
        NEXT_PUBLIC_CSP_CONNECT_SRC: "${NEXT_PUBLIC_CSP_CONNECT_SRC:-}"
    container_name: multisig-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider --quiet http://localhost:3000 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
