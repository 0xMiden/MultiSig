[package]
description = "Builders for miden-usdcx admin notes, produced by a multisig account"
edition     = "2024"
license     = "MIT"
name        = "usdcx-admin-notes"
repository  = "https://github.com/0xMiden/MultiSig"
version     = "0.1.0"

[lints.rust]
missing_docs = "warn"
unsafe_code  = "forbid"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Enables the wasm-bindgen JS bindings (built with wasm-pack --target web).
wasm = ["dep:wasm-bindgen", "dep:getrandom"]

[dependencies]
miden-protocol  = { version = "=0.17.0-rc.7", default-features = false, features = ["std"] }
miden-standards = { version = "=0.17.0-rc.7", default-features = false, features = ["std"] }
miden-tx        = { version = "=0.17.0-rc.7", default-features = false, features = ["std"] }
xusdc-encoding  = { git = "https://github.com/0xMiden/miden-usdcx", rev = "e68f8bc" }
thiserror = { version = "2", default-features = false }
wasm-bindgen = { version = "0.2", optional = true }
# Force getrandom's browser backend for the wasm build (pulled transitively by k256).
getrandom = { version = "0.2", features = ["js"], optional = true }

[dev-dependencies]
miden-testing = "=0.17.0-rc.7"
