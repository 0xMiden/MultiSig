# Runs test related jobs.

name: test

# Limits workflow concurrency to only the latest commit in the PR.
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review] 

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@main
      - uses: taiki-e/install-action@nextest 
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update 
      - name: Build tests
        run: make test-build
      - name: test
        run: make test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: bin/coordinator-frontend
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bin/coordinator-frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run test:ledger
      - run: node --test scripts/test-*.cjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Fake-device Ledger session suite: no external services needed.
      - name: Ledger session suite
        run: npm run test:ledger:ui
      - name: Build
        run: npm run build
      # Production build: loads the real USB SDK and opens the Ledger dialog.
      - name: Production app suite
        run: npm run test:ledger:app
