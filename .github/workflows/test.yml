# Runs test related jobs.

name: test

# Limits workflow concurrency to only the latest commit in the PR.
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review] 

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@main
      - uses: taiki-e/install-action@nextest 
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update 
      - name: Build tests
        run: make test-build
      - name: test
        run: make test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: bin/coordinator-frontend
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bin/coordinator-frontend/package-lock.json
      - run: npm ci
      # High/critical advisories fail, except entries in scripts/audit-allowlist.json
      # (each with a reason and a review date).
      - name: Audit production dependencies
        run: node scripts/audit-gate.mjs
      - run: npm run typecheck
      - run: npm run test:ledger
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Fake-device Ledger session suite: no external services needed.
      - name: Ledger session suite
        run: npm run test:ledger:ui
      # NEXT_PUBLIC_* values are inlined at build time. Without them the app stops
      # at "misconfigured" and the suite below would never load the Miden SDK.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_MIDEN_NETWORK: testnet
          NEXT_PUBLIC_MIDEN_RPC_URL: https://rpc.testnet.miden.io
          NEXT_PUBLIC_MIDEN_NOTE_TRANSPORT_URL: https://transport.miden.io
          NEXT_PUBLIC_GUARDIAN_ENDPOINT: https://guardian-testnet.openzeppelin.com
      # Production build: loads the real USB SDK and opens the Ledger dialog, and
      # checks the security policy admits the endpoints above (same values).
      - name: Production app suite
        run: npm run test:ledger:app
        env:
          NEXT_PUBLIC_MIDEN_RPC_URL: https://rpc.testnet.miden.io
          NEXT_PUBLIC_MIDEN_NOTE_TRANSPORT_URL: https://transport.miden.io
          NEXT_PUBLIC_GUARDIAN_ENDPOINT: https://guardian-testnet.openzeppelin.com
